<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>AmpMatrix local simulation</title><style>body{background:#eee;margin:24px;font-family:system-ui}main{max-width:800px;margin:auto}ampmatrix-card{display:block;margin-bottom:24px}</style><main><p>Local simulation · no device connection</p><ampmatrix-card id="light"></ampmatrix-card><ampmatrix-card id="dark"></ampmatrix-card></main><script type="module">
import './dist/ampmatrix-card.js';
const id='media_player.demo';const p={state:'on',attributes:{friendly_name:'Demo amplifier',volume_level:.15625,supported_features:217021,source:'Airplay',source_list:['AUXIN','Bluetooth','IR','Spotify'],sound_mode:'My EQ',sound_mode_list:['My EQ','Normal','Flat','Jazz','Rock','Movie','Classic','Pop','News']}};
window.demo={calls:[],player:p,fail:false};
const cards=[document.querySelector('#light'),document.querySelector('#dark')];
const hass={language:'it',states:{[id]:p},callService:async(domain,service,data)=>{demo.calls.push({domain,service,data});if(demo.fail)throw Error('simulated failure');if(service==='turn_off')p.state='off';if(service==='turn_on')p.state='on';if(service==='volume_up')p.attributes.volume_level=Math.min(1,p.attributes.volume_level+1/32);if(service==='volume_down')p.attributes.volume_level=Math.max(0,p.attributes.volume_level-1/32);if(service==='volume_set')p.attributes.volume_level=data.volume_level;if(service==='select_source')p.attributes.source=data.source;if(service==='select_sound_mode')p.attributes.sound_mode=data.sound_mode;demo.update();}};
demo.update=()=>cards.forEach(c=>c.hass=hass);demo.cards=cards;cards.forEach((c,i)=>c.setConfig({entity:id,color_mode:i?'dark':'light'}));demo.update();
</script></html>
